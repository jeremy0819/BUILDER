name: CI

# Urban Renewal OS — 五道 Gate：Gate0–Gate4（M1 Task 1）。任一 Gate 紅即擋 merge。
# 註：PDF 原列四道（Gate1–4），本 CI 另加 Gate0 資料紀律紅線＝共五道；Gate1 含 pytest 與
#     min_example 兩條指令（同屬「Python」一道），故 5 道 Gate ＝ 6 條驗證指令。
# 設計依據：docs/architecture/MIGRATION_PLAN.md 步驟3、FREEZE_REVIEW-2026-07.md（CI 從零建立）。
# 所有步驟都從 repo 根目錄執行。

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── M2-B：套件可安裝性（pyproject）——裝完後從非 repo 目錄 import 必須成功 ──
      # 註：apps/streamlit/app.py 保留 sys.path 墊片（Streamlit Cloud 只裝 requirements.txt，
      #     不會 pip install -e .；墊片是該環境的零風險路徑，兩者並存、互不干擾）。
      - name: "Gate 1.5 — Package installability (pip install -e .)"
        run: |
          pip install -e .
          cd /tmp && python -c "import core.redcf as r; print('installed import OK', r.CORE_VERSION)"

      # ── Gate 0：資料紀律（紅線）——真實案件段名零命中 ──────────────
      - name: "Gate 0 — No real names"
        run: bash check_no_real_names.sh

      # ── Gate 1：Python（pytest 黃金＋合約＋headless、schema 驗證、min_example）──
      - name: "Gate 1 — pytest (golden + contract + headless + schema)"
        run: python -m pytest -q
      - name: "Gate 1 — min_example smoke"
        run: python min_example.py

      # ── Gate 2：Core 零 UI 依賴（封鎖 streamlit/plotly 後仍能 import + 計算）──
      - name: "Gate 2 — Core import isolation"
        run: python tools/check_core_isolation.py

      # ── Gate 3：Excel 範本迴歸（內容比對，非 raw bytes；防範本被誤改）──
      - name: "Gate 3 — Template regression"
        run: python tools/check_template.py

      # ── Gate 4：靜態站本地連結（apps/web 死連結/404 即 Fail）──────────
      - name: "Gate 4 — Static web links"
        run: python tools/check_web_links.py

      # ── Gate 5：URBAN STRAND 遊戲核心 headless（機制＋可贏性 8–24 週）──
      - name: "Gate 5 — Simulator headless (node)"
        run: node tests/web/test_os_simulator.mjs

      # ── Gate 6：Schema 凍結守衛（v1.1 + v2.0 + v2.1 + 三視圖 + wf-1.0 位元組不可變）──
      - name: "Gate 6 — Schema freeze guard"
        run: python tools/check_schema_freeze.py

      # ── Gate 7：WORKSPACE 案件管理層 headless（import-to-create 轉換＋SSOT 稽核）──
      - name: "Gate 7 — Workspace headless (node)"
        run: node tests/web/test_workspace.mjs

      # ── Gate 8：圖檔白名單（真實圖資零進版控——文字掃描抓不到影像的補洞）──
      - name: "Gate 8 — Image whitelist"
        run: python tools/check_image_whitelist.py

      # ── Gate 9：core-bundle.js 與 core/redcf 同步（Pyodide 端＝同一份 SSOT，防第二真源）──
      - name: "Gate 9 — Core bundle in sync"
        run: python tools/check_core_bundle.py

      # ── Gate 10：前端版本徽章與 Core／tag 同步（防呈現層版本漂移：首頁 0.4.0 vs 某頁 0.3.0）──
      - name: "Gate 10 — Web version consistency"
        run: python tools/check_web_version.py

      # ── Gate 11：M7 Memory 層紀律（append-only／不記推論／Session 非第二真源／遷移不刪舊資料）──
      - name: "Gate 11 — Case OS store headless (node)"
        run: node tests/web/test_case_store.mjs

      # ── Gate 12：M7.1 接 UI 的產生端紀律（改清冊/拉滑桿/建案件寫出的事件不得含推論、須合約內）──
      #    Gate 11 擋「欄位名叫 verdict」，Gate 12 擋「有人把投報率塞進 after」——兩層一起才守得住。
      - name: "Gate 12 — Activity wiring headless (node)"
        run: node tests/web/test_activity_wiring.mjs

      # ── Gate 13：M7.3 Scenario 紀律（恰好一個作準／engine 不含推論／完整 input set）──
      - name: "Gate 13 — Scenario headless (node)"
        run: node tests/web/test_scenario.mjs

      # ── Gate 14：M7.5 量體視圖紀律（純呈現／零領域公式／合計只從 Core result 取）──
      - name: "Gate 14 — Massing view headless (node)"
        run: node tests/web/test_massing.mjs

      # ── Gate 15：M7.4 歸因接線紀律（UI 零計算／送完整 engine／不寫回 CaseStore／
      #    殘差與進位對帳不得混淆／core 不可用不得退回 JS 自算）──
      - name: "Gate 15 — Attribution wiring headless (node)"
        run: node tests/web/test_attribution_wiring.mjs
