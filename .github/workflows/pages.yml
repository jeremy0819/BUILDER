name: Deploy apps/web to GitHub Pages

# 為什麼需要這個 workflow：apps/web 是子目錄，GitHub Pages 的「Deploy from a branch」
# 只能選 repo 根或 /docs，無法指向 apps/web。故用 Actions 部署：把 apps/web 當 Pages 根上傳。
# 啟用方式（repo 擁有者一次性）：Settings → Pages → Source 選「GitHub Actions」。
# 之後推送到下列分支（且動到 apps/web）即自動部署；也可在 Actions 頁手動 Run workflow。

on:
  workflow_dispatch:
  push:
    branches:
      - main            # 2026-07-13 分支收斂為單線 main（舊觸發分支已刪除）
    paths:
      - "apps/web/**"
      - ".github/workflows/pages.yml"
      - "tools/spatial-prototype/**"
      - "tools/build_pages.py"
      - "tools/prepare_spatial_prototype.py"

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署，不取消進行中的（避免半途中斷 Pages）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prepare pinned synthetic-viewer assets
        run: python tools/prepare_spatial_prototype.py
      - name: Assemble public site and independent synthetic prototype
        run: python tools/build_pages.py --output "${{ runner.temp }}/builder-pages"
      - uses: actions/configure-pages@v5
      - name: Upload assembled Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/builder-pages
      - id: deployment
        uses: actions/deploy-pages@v4
