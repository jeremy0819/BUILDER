<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>BUILDER · 策略分析工作區</title>
  <link rel="stylesheet" href="os-unified.css">
  <link rel="stylesheet" href="strategy-workspace.css">
  <script src="security.js" defer></script>
  <script src="case-bus.js" defer></script>
  <script src="stepnav.js" defer></script>
  <script src="os-shell.js" defer></script>
  <script src="core-runtime.js" defer></script>
  <script src="decision-view.js" defer></script>
  <script src="strategy-workspace.js" defer></script>
</head>
<body class="uros-unified uros-page-decision">
  <main class="strategy-workspace" id="strategy-workspace">
    <div class="strategy-heading"><div><h1>策略分析</h1><p id="analysis-context">讀取案件中</p></div>
      <div class="strategy-commands"><button type="button" id="runtime-retry" hidden>重新連線</button>
        <button type="button" id="analysis-run" class="primary" disabled>產生策略分析</button></div></div>
    <div class="analysis-status" id="analysis-status" role="status" aria-live="polite">準備中</div>
    <div class="analysis-caveat">方向性建議。完工機率尚未校準；同意計數採案件快照，不等同最新簽署或法定同意比例；地主分型以實際接觸紀錄為準。</div>
    <div id="analysis-empty" hidden></div>
    <div id="analysis-content" hidden>
      <section class="analysis-top" aria-label="判讀與財務"><div id="decision-visual"></div></section>
      <div class="strategy-columns">
        <section class="strategy-inputs" aria-labelledby="profiles-title">
          <div class="section-heading"><h2 id="profiles-title">地主觀察</h2><span id="profile-save" role="status"></span></div>
          <div class="profile-tools"><input id="owner-search" type="search" placeholder="搜尋戶別代號" aria-label="搜尋戶別代號"><select id="owner-filter" aria-label="篩選地主"><option value="all">全部</option><option value="unclassified">未分型</option><option value="blocked">產權待清理</option><option value="key">關鍵戶</option></select></div>
          <div id="profiles" class="profile-list"></div>
          <details class="assumptions-panel"><summary>財務假設與情境</summary>
            <form id="analysis-assumptions" class="assumption-grid"></form>
            <p>空白欄位保留為資料不足。金額單位：萬元。</p>
          </details>
        </section>
        <section class="strategy-results" aria-labelledby="actions-title">
          <div class="section-heading"><h2 id="actions-title">行動順序</h2><button id="export-strategy" type="button" class="icon-command" title="匯出策略 JSON" aria-label="匯出策略 JSON" disabled>↓</button></div>
          <div id="strategy-summary" class="strategy-summary"></div>
          <div class="queue-tabs" role="tablist" aria-label="行動類別"><button type="button" role="tab" data-queue="persuasion" aria-selected="true">地主溝通</button><button type="button" role="tab" data-queue="administrative" aria-selected="false" tabindex="-1">產權清理</button></div>
          <div id="action-list" class="action-list" aria-live="polite"></div>
          <div id="action-evidence" class="action-evidence"></div>
          <details id="decision-details" class="decision-details"><summary>三方期望值與模型依據</summary><div id="decision-table"></div><button type="button" id="export-decision" disabled>匯出判讀 JSON</button></details>
        </section>
      </div>
    </div>
  </main>
</body>
</html>
