<style>
/* ————————————————————————————————————————————————
   WORKSPACE — 案件管理層（M3-C C2：骨架＋案件列表＋匯入建案）
   本地儲存（localStorage）· 零計算：顯示的財務數字逐欄來自匯入 v2.1 的 result（SSOT）。
   純轉換邏輯抽在下方 WORKLOGIC 標記區塊（node headless 可測，零 DOM）。
   真實案件資料只存瀏覽器 localStorage，永不進版控。主題：儀表板雙主題（日用工具）。
———————————————————————————————————————————————— */
:root{
  --accent:#5A3FE0; --accent-2:#8A6BF5; --accent-soft:#eeeafb;
  --bg:#f5f4f9; --panel:#ffffff; --ink:#171529; --mute:#67637d; --line:#e7e4f0;
  --err:#d1394b; --warn:#b7791f; --info:#2563eb; --ok:#0f9d6a;
  --ok-bg:#e6f7f0; --warn-bg:#fbf2e1;
  --shadow:0 1px 2px rgba(23,21,41,.05),0 12px 30px rgba(23,21,41,.07);
  --r:16px; --mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --accent:#9a86ff; --accent-2:#b9abff; --accent-soft:#221d3c;
  --bg:#0d0c15; --panel:#181626; --ink:#edeafb; --mute:#a6a2c0; --line:#2a2740;
  --err:#f4788a; --warn:#e0aa55; --info:#82a8f8; --ok:#4fd3a4;
  --ok-bg:#10261e; --warn-bg:#2a2112;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 30px rgba(0,0,0,.4);
}}
:root[data-theme="light"]{--accent:#5A3FE0;--accent-2:#8A6BF5;--accent-soft:#eeeafb;--bg:#f5f4f9;--panel:#fff;--ink:#171529;--mute:#67637d;--line:#e7e4f0;--err:#d1394b;--warn:#b7791f;--info:#2563eb;--ok:#0f9d6a;--ok-bg:#e6f7f0;--warn-bg:#fbf2e1;--shadow:0 1px 2px rgba(23,21,41,.05),0 12px 30px rgba(23,21,41,.07)}
:root[data-theme="dark"]{--accent:#9a86ff;--accent-2:#b9abff;--accent-soft:#221d3c;--bg:#0d0c15;--panel:#181626;--ink:#edeafb;--mute:#a6a2c0;--line:#2a2740;--err:#f4788a;--warn:#e0aa55;--info:#82a8f8;--ok:#4fd3a4;--ok-bg:#10261e;--warn-bg:#2a2112;--shadow:0 1px 2px rgba(0,0,0,.35),0 12px 30px rgba(0,0,0,.4)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:26px 20px 64px}
.tnum{font-variant-numeric:tabular-nums} .mono{font-family:var(--mono)}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}

header.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;
  padding-bottom:15px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent-2));
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;flex:none}
h1{font-size:21px;margin:0;letter-spacing:-.01em;font-weight:800}
.sub{color:var(--mute);font-size:12.5px;margin-top:2px}
.navr{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.pill{font-size:11.5px;font-weight:650;padding:5px 11px;border-radius:999px;border:1px solid var(--line);color:var(--mute);background:var(--panel);cursor:pointer;text-decoration:none}
.pill:hover{border-color:var(--accent);color:var(--accent);text-decoration:none}

.ssot{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);
  border:1px solid color-mix(in srgb,var(--accent) 22%,transparent);border-radius:12px;
  padding:11px 15px;margin:18px 0 20px;font-size:12.5px}
.ssot b{color:var(--accent)}

/* 匯入區 */
.import{background:var(--panel);border:1.5px dashed color-mix(in srgb,var(--accent) 40%,var(--line));border-radius:var(--r);
  padding:22px;text-align:center;box-shadow:var(--shadow);margin-bottom:22px;transition:border-color .15s,background .15s}
.import.drag{border-color:var(--accent);background:var(--accent-soft)}
.import h2{margin:0 0 4px;font-size:16px}
.import p{margin:0 0 14px;color:var(--mute);font-size:12.5px}
.btn{cursor:pointer;font-size:13px;font-weight:700;border:1px solid var(--accent);background:var(--accent);color:#fff;
  padding:9px 20px;border-radius:9px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{font-size:11.5px;padding:6px 12px;border-radius:8px}
.btn.danger{border-color:color-mix(in srgb,var(--err) 45%,transparent);background:transparent;color:var(--err)}
.err{color:var(--err);font-size:12px;margin-top:10px;min-height:16px}

.slab{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);font-weight:700;margin:0 2px 12px}
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 17px;box-shadow:var(--shadow)}
.card .ct{font-size:10.5px;font-weight:800;letter-spacing:.04em;color:var(--accent);text-transform:uppercase}
.card .cn{font-size:17px;font-weight:750;margin:2px 0 4px}
.card .meta{font-family:var(--mono);font-size:10.5px;color:var(--mute);word-break:break-all}
/* ①決策狀態＝保留空槽（待 Decision Engine · M4；C2 不填、不推論） */
.dslot{display:flex;align-items:center;gap:8px;margin:11px 0 2px;padding:8px 11px;border-radius:10px;
  border:1px dashed var(--line);background:color-mix(in srgb,var(--mute) 6%,transparent);color:var(--mute);font-size:11.5px}
.dslot .dk{font-weight:800;letter-spacing:.03em;color:var(--ink);opacity:.5}
.dslot .dwait{margin-left:auto;font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:999px;border:1px solid var(--line)}
.sgrp{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);opacity:.7;font-weight:700;margin:12px 0 2px}
.card .kpis{display:flex;gap:14px;flex-wrap:wrap;margin:4px 0 4px}
.card .kpi .k{font-size:10.5px;color:var(--mute)}
.card .kpi .v{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.progress{height:8px;border-radius:999px;background:var(--line);overflow:hidden;margin:9px 0 3px;position:relative}
.progress>span{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:999px}
.progress .thr{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.55}
.plab{display:flex;justify-content:space-between;font-size:11px;color:var(--mute)}
.card .acts{display:flex;gap:7px;margin-top:13px;flex-wrap:wrap}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:var(--r);padding:34px 20px;text-align:center;color:var(--mute);font-size:13px}

footer{margin-top:30px;padding-top:13px;font-size:11px;color:var(--mute)}
</style>

<section data-spatial-stage></section>

<script>

/* ── DOM / localStorage 層（不進 headless）── */
const $ = id => document.getElementById(id);
const KEY = "uros.workflow.v1";
const pct = x => x==null ? "—" : (x*100).toFixed(1)+"%";
const shortHash = h => (h||"").replace(/^sha256:/,"").slice(0,10);

function loadStore(){ return UROSSecurity.parseJSON(localStorage.getItem(KEY)||"null") || {order:[],projects:{}}; }
function saveStore(s){ localStorage.setItem(KEY, JSON.stringify(s)); }

function addProject(v21){
  const incoming = WORKLOGIC.importV21ToWorkflow(v21);
  const snap = WORKLOGIC.displaySnapshot(v21);
  const pid = incoming.project.project_id;
  const s = loadStore();
  const existing = s.projects[pid];
  if(existing){ // 多快照重評：保留既有 workflow（事件/任務/決策/階段），新增或切換作準快照
    const wf = existing.wf, ns = incoming.project.snapshots[0];
    wf.project.snapshots = wf.project.snapshots || [];
    let m = wf.project.snapshots.find(x => x.input_hash === ns.input_hash);
    if(!m){ ns.id = "snap-" + String(wf.project.snapshots.length + 1).padStart(2,"0"); ns.label = "重評 " + ns.id;
      wf.project.snapshots.push(ns); m = ns; }
    wf.project.active_snapshot = m.id;
    s.projects[pid] = {wf, snap, engine: v21.engine || existing.engine || null};   // 重評：更新 engine
    saveStore(s); return pid;
  }
  s.order.unshift(pid);
  s.projects[pid] = {wf: incoming, snap, engine: v21.engine || null};   // M5.5：留 engine 供即時運算（Pyodide）重算
  saveStore(s);
  return pid;
}
// M4：掛 decision JSON——以 input_hash × core_version **二元組**配對案件快照（可溯源鐵律）；
// 配不上＝拒收不臆造，且**說出配不上的原因**——「跨版本」與「找不到」是兩件事，
// 前者代表使用者手上有一份用舊公式算出的 verdict，必須被明白告知要重算（N1 從嚴裁決）。
function attachDecision(dec){
  const s=loadStore();
  let 最佳="hash_mismatch";
  const 優先=["hash_mismatch","snapshot_core_version_missing","core_version_unknown","core_version_mismatch"];
  for(const p of s.order){
    const r=WORKLOGIC.matchDecisionDetail(s.projects[p].wf, dec);
    if(r.matched){ s.projects[p].decision=dec; saveStore(s); return p; }
    if(優先.indexOf(r.reason) > 優先.indexOf(最佳)) 最佳=r.reason;
  }
  throw new Error("decision 對不上任何案件快照（不得掛錯案）：" + WORKLOGIC.mismatchMessage(最佳));
}
// wf bundle 還原（可攜性閉環）：只帶 workflow 狀態，財務數字仍留在原 v2.1（SSOT）
function importWfBundle(wf){
  if(!wf.project || !wf.project.project_id) throw new Error("非有效 wf-1.0 檔（缺 project）");
  const p = wf.project, sn = (p.snapshots||[]).find(x => x.id === p.active_snapshot) || (p.snapshots||[])[0] || {};
  const owners = (wf.stakeholders||[]).filter(s => s.role === "owner");
  const snap = {code_name:p.code_name||"未命名", case_type:p.case_type||"urban_renewal", stakeholders_n:owners.length,
    input_hash:sn.input_hash||"", core_version:sn.core_version||"", computed_at:sn.computed_at||"",
    shared_cost_ratio:null, return_rate:null, warnings_n:0, agreed:0, total:owners.length,
    threshold:WORKLOGIC.門檻(p.case_type), detached:true};
  const s = loadStore(); if(!s.projects[p.project_id]) s.order.unshift(p.project_id);
  s.projects[p.project_id] = {wf, snap}; saveStore(s); return p.project_id;
}
function delProject(pid){
  const s = loadStore();
  delete s.projects[pid]; s.order = s.order.filter(x=>x!==pid); saveStore(s);
}

// 決策槽：有 decision JSON＝逐欄呈現（引擎權威）；無＝空槽待判讀。本層零推導。
const V_CLS={GO:"ok",CAUTION:"warn",STOP:"err"};
function dslotHTML(dec){
  if(!dec) return `<div class="dslot"><span class="dk">決策狀態</span><span>待 Decision Engine 判讀</span><span class="dwait">M4</span></div>`;
  const bp=dec.breakpoint_stakeholder?` · 引爆點 ${esc(dec.breakpoint_stakeholder)}`:"";
  const ex=dec.exit_signal?` · <b style="color:var(--err)">EXIT</b>`:"";
  return `<div class="dslot decided"><span class="dk">決策狀態</span>
    <b class="dv" style="color:var(--${V_CLS[dec.verdict]||'mute'})">${esc(dec.verdict)}</b>
    <span>完工機率 ${(dec.completion_probability*100).toFixed(0)}%${bp}${ex} · 急迫 ${esc(dec.decision_urgency)}
      · <b style="color:var(--warn)">⚠ 方向性判斷（存活率未校準）· 非投資結論</b></span>
    <span class="dwait">DE ${esc(dec.decision_engine_version)}</span></div>`;
}
function caseCard(pid, rec){
  const {wf, snap} = rec;
  const typ = snap.case_type==="danger_building" ? "危老重建" : "都市更新";
  const ar = snap.total ? snap.agreed/snap.total : 0, thr = snap.threshold;
  return `<div class="card">
    <div class="ct">${typ}${wf.project.mode?" · "+esc(wf.project.mode):""}</div>
    <div class="cn">${esc(snap.code_name)}</div>
    ${dslotHTML(CaseBus.decisionBinds(rec).bound?rec.decision:null)}
    <div class="sgrp">Core Output · 逐欄自 result</div>
    <div class="kpis">
      <div class="kpi"><div class="k">共負比</div><div class="v">${pct(snap.shared_cost_ratio)}</div></div>
      <div class="kpi"><div class="k">投報率</div><div class="v">${pct(snap.return_rate)}</div></div>
      <div class="kpi"><div class="k">健檢</div><div class="v">${esc(snap.warnings_n)}</div></div>
    </div>
    <div class="sgrp">Workflow State · 事實</div>
    <div class="progress"><span style="width:${Math.min(100,ar*100)}%"></span><div class="thr" style="left:${thr*100}%"></div></div>
    <div class="plab"><span>${esc(wf.project.stage)} · 同意 ${esc(snap.agreed)}/${esc(snap.total)}（計數）</span><span>門檻 ${(thr*100)|0}%</span></div>
    <div class="meta" style="margin-top:8px">Snapshot ${esc(shortHash(snap.input_hash))}…@${esc(snap.core_version)} · ${esc(snap.stakeholders_n)} 利害關係人</div>
    <div class="acts">
      <button class="btn sm" data-case-action="open" data-case-id="${esc(pid)}">開啟</button>
      <button class="btn sm ghost" data-case-action="export" data-case-id="${esc(pid)}">匯出 wf</button>
      <button class="btn sm danger" data-case-action="remove" data-case-id="${esc(pid)}">刪除</button>
    </div></div>`;
}
function renderList(){
  const s = loadStore();
  $("case-view").style.display="none"; $("list-view").style.display="";
  // §6：有 decision 的案件依引擎 urgency 排序（引擎輸出鍵，非 UI 自算）；其餘維持匯入序
  const order = s.order.slice().sort((a,b)=>{
    const ua=s.projects[a]?.decision?.decision_urgency, ub=s.projects[b]?.decision?.decision_urgency;
    if(ua!=null&&ub!=null) return ub-ua;
    if(ua!=null) return -1; if(ub!=null) return 1; return 0;
  });
  $("cases").innerHTML = order.length
    ? order.map(pid => caseCard(pid, s.projects[pid])).join("")
    : `<div class="empty">尚無案件——匯入一份 v2.1 案件 JSON 開始。<br><span style="font-size:11.5px">（可用 schemas/examples/v2/v2_1_案例D_權變示範.json 測試）</span></div>`;
}
function openCase(pid){
  if(!loadStore().projects[pid]) return;
  CaseBus.setActive(pid); location.href=WorkflowPanels.route(new URLSearchParams(location.search).get("view")||"mass");
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

function toSandbox(pid){
  const rec=loadStore().projects[pid]; if(!rec) return; const {wf,snap}=rec;
  // B4：逐戶事實 verbatim（consent 來自匯入時點 tags；分回/找補來自 snap.allocations §56 權變表）
  const allocById={}; (snap.allocations||[]).forEach(a=>{allocById[a.owner_id]=a;});
  const owners=(wf.stakeholders||[]).filter(s=>s.role==="owner").map(s=>{
    const tag=(s.tags||[]).find(t=>t.startsWith("consent:"));
    const a=allocById[s.stakeholder_id]||null;
    return {owner_id:s.stakeholder_id, consent:tag?tag.slice(8):"pending",
      pre_value:a?a.pre_value:(s.pre_value??null), value_share:a?a.value_share:null, alloc:a};
  });
  const bridge={source:"workspace", project_id:wf.project.project_id, code_name:snap.code_name,
    case_type:snap.case_type, owners_n:snap.stakeholders_n, agreed:snap.agreed, total:snap.total,
    stage:wf.project.stage, ts:new Date().toISOString(),
    owners:(owners.length&&owners.length<=80)?owners:null};
  localStorage.setItem("uros.bridge.case", JSON.stringify(bridge));
  location.href="os-simulator.html";
}
function removeCase(pid){ if(confirm("刪除此案件？（僅移除本機紀錄，不影響匯入的原始 JSON）")){ delProject(pid); renderList(); } }
function exportCase(pid){
  const rec=loadStore().projects[pid]; if(!rec) return;
  const blob=new Blob([JSON.stringify(rec.wf,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download=rec.wf.project.project_id+"_workflow.json"; a.click(); URL.revokeObjectURL(a.href);
}
function handleFile(f){
  $("imp-err").textContent="";
  if(f.size > UROSSecurity.MAX_BYTES){ $("imp-err").textContent="匯入檔案超過 5 MB 限制"; return; }
  const rd=new FileReader();
  rd.onload=()=>{ try{
    const doc=UROSSecurity.parseJSON(rd.result);
    const pid=(doc && doc.decision_engine_version) ? attachDecision(doc)
            : (doc && ["wf-1.0","wf-1.1"].includes(doc.schema_version)) ? importWfBundle(doc) : addProject(doc);
    renderList();
    const el=document.querySelector(".cases .card"); if(el){el.style.outline="2px solid var(--accent)";setTimeout(()=>el.style.outline="",1200);}
  }catch(e){ $("imp-err").textContent="匯入失敗："+e.message; } };
  rd.onerror=()=>{ $("imp-err").textContent="讀檔失敗"; };
  rd.readAsText(f);
}
$("pick").onclick=()=>$("file").click();
$("file").onchange=e=>{ if(e.target.files[0]) handleFile(e.target.files[0]); e.target.value=""; };
const drop=$("drop");
["dragover","dragenter"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("drag");}));
["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove("drag");}));
drop.addEventListener("drop",e=>{ const f=e.dataTransfer.files[0]; if(f) handleFile(f); });
$("tgl").onclick=()=>{const root=document.documentElement;const cur=root.getAttribute("data-theme")||"dark";const next=cur==="dark"?"light":"dark";root.setAttribute("data-theme",next);try{localStorage.setItem("uros.theme",next)}catch(e){}};
document.addEventListener("click",e=>{
